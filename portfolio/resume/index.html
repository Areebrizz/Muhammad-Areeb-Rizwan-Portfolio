      { language: 'German', level: 'Basic (A1)' }
    ];

    // Common software skills
    const commonSoftware = ['SolidWorks', 'MATLAB', 'Ansys', 'Python', 'Power BI', 'Streamlit', 'Primavera P6', 'PLC', 'AutoCAD', 'CATIA v5'];

    // State
    let activeKey = 'all';

    // DOM references
    const resumeRoot = document.getElementById('resumeRoot');
    const versionTabs = document.getElementById('version-tabs');
    const printBtn = document.getElementById('printBtn');

    // Initialize version tabs
    function initTabs() {
      versionTabs.innerHTML = '';
      versionsOrder.forEach((k) => {
        const v = versions[k];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'px-3 py-1.5 text-sm font-medium rounded-md focus:outline-none transition-colors whitespace-nowrap';
        btn.setAttribute('data-key', k);
        btn.setAttribute('aria-pressed', 'false');
        btn.textContent = v.label;
        btn.addEventListener('click', () => setActiveVersion(k));
        btn.addEventListener('mouseenter', () => {
          if (btn.getAttribute('data-key') !== activeKey) {
            btn.classList.add('bg-blue-100', 'text-blue-700');
          }
        });
        btn.addEventListener('mouseleave', () => {
          if (btn.getAttribute('data-key') !== activeKey) {
            btn.classList.remove('bg-blue-100', 'text-blue-700');
          }
        });
        versionTabs.appendChild(btn);
      });
    }

    // Update tab styles
    function updateTabs() {
      Array.from(versionTabs.children).forEach((btn) => {
        const key = btn.getAttribute('data-key');
        const isActive = key === activeKey;
        btn.setAttribute('aria-pressed', String(isActive));
        if (isActive) {
          btn.classList.add('bg-blue-600', 'text-white');
          btn.classList.remove('text-slate-700', 'bg-blue-100', 'text-blue-700');
        } else {
          btn.classList.remove('bg-blue-600', 'text-white');
          btn.classList.add('text-slate-700', 'hover:bg-blue-50');
        }
      });
    }

    // Utility: escape HTML (for text content)
    function e(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Render the resume DOM based on activeKey
    function renderResume() {
      const vData = versions[activeKey];
      
      // Determine which sections to show based on version
      const showAllSections = activeKey === 'all';
      const showEntrepreneurial = true; // Show for all versions
      const showPublications = true; // Show for all versions
      const showHonors = true; // Show for all versions
      const showVolunteering = true; // Show for all versions
      
      // Build skills HTML
      const skillsHtml = (vData.skills || []).map(s => 
        `<div class="mb-1"><p class="text-sm text-slate-800 leading-tight">• ${e(s)}</p></div>`
      ).join('');
      
      // Build projects HTML
      const projectsHtml = (vData.projects || []).map(p => {
        const linkHtml = p.link ? 
          `<a href="${e(p.link)}" target="_blank" rel="noopener noreferrer" class="text-[10px] text-blue-600 flex items-center gap-1 font-bold uppercase mt-2 hover:text-blue-800 transition-colors">
            <i data-lucide="external-link" style="width:10px;height:10px"></i> View Project
          </a>` : 
          '';
        return `
          <div class="bg-slate-50 p-4 rounded-lg border border-slate-100 flex flex-col justify-between break-inside-avoid">
            <div>
              <h4 class="font-bold text-slate-900 text-sm mb-1">${e(p.title)}</h4>
              <p class="text-xs text-slate-600 leading-relaxed mb-2">${e(p.desc)}</p>
            </div>
            ${linkHtml}
          </div>
        `;
      }).join('');
      
      // Build experience HTML
      const experienceHtml = (vData.experience || []).map((exp, idx) => {
        const bullets = (exp.bullets || []).map(b => 
          `<li class="text-sm text-slate-700 mb-1">${b}</li>`
        ).join('');
        return `
          <div class="relative pl-6 border-l-2 border-slate-100 mb-6 break-inside-avoid">
            <div class="absolute -left-[9px] top-0 w-4 h-4 ${idx === 0 ? 'bg-blue-600' : 'bg-slate-300'} rounded-full border-4 border-white"></div>
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start mb-1 gap-1">
              <h3 class="font-bold text-slate-900 text-base">${e(exp.title)}</h3>
              <span class="text-xs font-bold bg-slate-100 px-2 py-1 rounded text-slate-600 whitespace-nowrap">${e(exp.date || '')}</span>
            </div>
            <p class="text-sm font-semibold text-blue-600 mb-2">${e(exp.company || '')}</p>
            <ul class="text-sm text-slate-700 space-y-1 list-inside list-disc pl-1">
              ${bullets}
            </ul>
          </div>
        `;
      }).join('');
      
      // Build certifications HTML
      const certificationsHtml = (vData.certifications || []).map(cert => 
        `<li class="text-xs text-slate-700 mb-1">${e(cert)}</li>`
      ).join('');
      
      // Build languages HTML
      const languagesHtml = commonLanguages.map(lang => `
        <p class="text-xs mb-1"><span class="font-bold">${e(lang.language)}:</span> 
        <span class="text-slate-600">${e(lang.level)}</span></p>
      `).join('');
      
      // Build software skills HTML
      const softwareHtml = commonSoftware.map(tool => 
        `<span class="px-2 py-1 bg-white border border-slate-200 text-slate-700 text-[11px] rounded font-medium">${tool}</span>`
      ).join('');
      
      // Build publications HTML
      const publicationsHtml = commonPublications.map(pub => `
        <div class="mb-4">
          <h4 class="font-bold text-slate-900 text-sm italic">${e(pub.title)}</h4>
          <p class="text-xs text-slate-600 mt-1">${e(pub.authors)} (${e(pub.year)})</p>
          <p class="text-xs text-slate-700 mt-2">${e(pub.description)}</p>
        </div>
      `).join('');
      
      // Build honors HTML
      const honorsHtml = commonHonors.map(honor => 
        `<p class="text-xs text-slate-700 mb-1">• ${e(honor)}</p>`
      ).join('');
      
      // Build volunteering HTML
      const volunteeringHtml = commonVolunteering.map(vol => 
        `<p class="text-xs text-slate-700 mb-1">• ${e(vol)}</p>`
      ).join('');
      
      // Build entrepreneurial HTML
      const entrepreneurialHtml = `
        <div class="mb-4">
          <h4 class="font-bold text-slate-900 text-sm">${e(commonEntrepreneurial.title)}</h4>
          <p class="text-xs font-semibold text-blue-600">${e(commonEntrepreneurial.company)} • ${e(commonEntrepreneurial.period)}</p>
          <ul class="text-xs text-slate-700 mt-2 space-y-1 list-disc pl-4">
            ${commonEntrepreneurial.bullets.map(b => `<li>${e(b)}</li>`).join('')}
          </ul>
        </div>
      `;

      // Build main HTML
      resumeRoot.innerHTML = `
        <header class="bg-slate-900 text-white p-8 md:p-12 print:p-8 break-inside-avoid">
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div class="flex-1">
              <h1 class="text-3xl md:text-4xl font-bold tracking-tight mb-1 uppercase">${e(vData.title)}</h1>
              <p class="text-blue-400 text-lg font-semibold uppercase tracking-widest mb-3">${e(vData.subtitle)}</p>
              <p class="text-slate-300 max-w-2xl text-sm leading-relaxed">${e(vData.summary)}</p>
            </div>
            <div class="flex flex-col gap-3 text-sm text-slate-300 whitespace-nowrap">
              <span class="flex items-center gap-2"><i data-lucide="mail"></i> engr.areebriz@gmail.com</span>
              <span class="flex items-center gap-2"><i data-lucide="globe"></i> www.areebrizwan.com</span>
              <span class="flex items-center gap-2"><i data-lucide="linkedin"></i> linkedin.com/in/areebrizwan</span>
              <span class="flex items-center gap-2"><i data-lucide="map-pin"></i> Karachi, Pakistan</span>
              <span class="flex items-center gap-2"><i data-lucide="phone"></i> (+92) 313 1011523</span>
            </div>
          </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3">
          <aside class="col-span-1 bg-slate-50 border-r border-slate-200 p-8 flex flex-col gap-8 print:bg-white break-inside-avoid">
            <section>
              <h2 class="flex items-center gap-2 text-slate-900 font-bold uppercase tracking-wider mb-4 border-b-2 border-blue-500 pb-1">
                <i data-lucide="graduation-cap"></i> Education
              </h2>
              <div class="space-y-3">
                <div>
                  <h3 class="font-bold text-slate-800 text-sm">${e(commonEducation.degree)}</h3>
                  <p class="text-xs text-slate-600">${e(commonEducation.institution)}</p>
                  <p class="text-xs text-slate-600">${e(commonEducation.period)} • ${e(commonEducation.location)}</p>
                  <p class="text-xs text-slate-700 mt-2">${e(commonEducation.details)}</p>
                  <p class="text-xs font-semibold text-blue-700 mt-1">${e(commonEducation.gpa)}</p>
                  <p class="text-xs text-slate-600 mt-2 italic">Thesis: ${e(commonEducation.thesis)}</p>
                </div>
              </div>
            </section>

            <section>
              <h2 class="flex items-center gap-2 text-slate-900 font-bold uppercase tracking-wider mb-4 border-b-2 border-blue-500 pb-1">
                <i data-lucide="cpu"></i> Core Skills
              </h2>
              <div class="space-y-2">${skillsHtml}</div>
            </section>

            <section>
              <h2 class="flex items-center gap-2 text-slate-900 font-bold uppercase tracking-wider mb-4 border-b-2 border-blue-500 pb-1">
                <i data-lucide="code"></i> Software & Tools
              </h2>
              <div class="flex flex-wrap gap-1.5">
                ${softwareHtml}
              </div>
            </section>

            <section>
              <h2 class="flex items-center gap-2 text-slate-900 font-bold uppercase tracking-wider mb-4 border-b-2 border-blue-500 pb-1">
                <i data-lucide="check-circle"></i> Certifications
              </h2>
              <ul class="text-xs text-slate-700 space-y-2 list-disc pl-4">
                ${certificationsHtml}
              </ul>
            </section>

            <section>
              <h2 class="flex items-center gap-2 text-slate-900 font-bold uppercase tracking-wider mb-4 border-b-2 border-blue-500 pb-1">
                <i data-lucide="globe"></i> Languages
              </h2>
              <div class="text-xs space-y-1">
                ${languagesHtml}
              </div>
            </section>
            
            ${showVolunteering ? `
            <section>
              <h2 class="flex items-center gap-2 text-slate-900 font-bold uppercase tracking-wider mb-4 border-b-2 border-blue-500 pb-1">
                <i data-lucide="heart"></i> Volunteering
              </h2>
              <div class="text-xs space-y-1">
                ${volunteeringHtml}
              </div>
            </section>
            ` : ''}
          </aside>

          <main class="col-span-2 p-8 md:p-12 flex flex-col gap-10 print:p-8">
            <section>
              <h2 class="flex items-center gap-3 text-slate-900 font-bold uppercase tracking-widest mb-6 text-lg">
                <i data-lucide="briefcase"></i> Professional Experience
              </h2>
              <div class="space-y-8">
                ${experienceHtml}
              </div>
            </section>
            
            ${showEntrepreneurial ? `
            <section>
              <h2 class="flex items-center gap-3 text-slate-900 font-bold uppercase tracking-widest mb-4 text-lg">
                <i data-lucide="rocket"></i> Entrepreneurial Experience
              </h2>
              <div class="p-4 bg-slate-50 rounded-lg border border-slate-200">
                ${entrepreneurialHtml}
              </div>
            </section>
            ` : ''}

            <section>
              <h2 class="flex items-center gap-3 text-slate-900 font-bold uppercase tracking-widest mb-6 text-lg">
                <i data-lucide="settings"></i> Key Projects
              </h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${projectsHtml || '<div class="col-span-2 text-xs text-slate-500 p-4 bg-slate-50 rounded">No projects listed for this version.</div>'}
              </div>
            </section>

            ${showPublications ? `
            <section>
              <h2 class="flex items-center gap-3 text-slate-900 font-bold uppercase tracking-widest mb-4 text-lg">
                <i data-lucide="microscope"></i> Research & Publications
              </h2>
              <div class="p-4 bg-blue-50 rounded-lg border-l-4 border-blue-500">
                ${publicationsHtml}
              </div>
            </section>
            ` : ''}

            ${showHonors ? `
            <section>
              <h2 class="flex items-center gap-3 text-slate-900 font-bold uppercase tracking-widest mb-4 text-lg">
                <i data-lucide="award"></i> Honors & Awards
              </h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-y-2 text-xs text-slate-700">
                ${honorsHtml}
              </div>
            </section>
            ` : ''}
          </main>
        </div>

        <footer class="bg-slate-50 border-t border-slate-200 p-6 text-center text-slate-400 text-[10px] print:hidden">
          Version: ${e(vData.label)} • Built with HTML, Tailwind CSS & Lucide • Updated: ${new Date().toLocaleDateString()}
        </footer>
      `;

      // Replace lucide icons in the newly created DOM
      if (window.lucide && typeof window.lucide.replace === 'function') {
        window.lucide.replace({ 'stroke-width': 1.5, width: 18, height: 18 });
      }
    }

    // Change active version
    function setActiveVersion(key, pushState = true) {
      if (!versions[key]) return;
      activeKey = key;
      
      // Update URL param
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('v', activeKey);
        if (pushState) window.history.replaceState({}, '', url.toString());
      } catch (err) { /* ignore */ }

      // Update doc title
      document.title = `${versions[activeKey].label} — ${versions[activeKey].title}`;

      updateTabs();
      renderResume();
    }

    // Initialize: read ?v= or hash
    function initFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const v = params.get('v') || (window.location.hash ? window.location.hash.replace('#', '') : null);
      if (v && versions[v]) activeKey = v;
    }

    // Print handler
    printBtn.addEventListener('click', () => {
      // give the browser a moment to reflow (if necessary)
      setTimeout(() => {
        document.title = `Resume - ${versions[activeKey].label} - ${versions[activeKey].title}`;
        window.print();
        // Restore original title after a delay
        setTimeout(() => {
          document.title = `Resume — Muhammad Areeb Rizwan Siddiqui`;
        }, 1000);
      }, 50);
    });

    // Initialize everything
    function init() {
      initTabs();
      initFromUrl();
      setActiveVersion(activeKey, false);
    }

    // Start when DOM is loaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    // Accessibility: keyboard navigation for tabs (left/right)
    document.addEventListener('keydown', (e) => {
      if (e.target.closest('#version-tabs')) {
        const focusable = Array.from(versionTabs.querySelectorAll('button'));
        const idx = focusable.indexOf(document.activeElement);
        if (e.key === 'ArrowRight') {
          const next = focusable[(idx + 1) % focusable.length];
          next.focus();
          e.preventDefault();
        } else if (e.key === 'ArrowLeft') {
          const prev = focusable[(idx - 1 + focusable.length) % focusable.length];
          prev.focus();
          e.preventDefault();
        } else if (e.key === 'Enter' || e.key === ' ') {
          document.activeElement.click();
          e.preventDefault();
        }
      }
    });

    // Ensure icons in tab bar are rendered (if any)
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide && typeof window.lucide.replace === 'function') {
        window.lucide.replace({ 'stroke-width': 1.5, width: 18, height: 18 });
      }
    });
  </script>
</body>
</html>
